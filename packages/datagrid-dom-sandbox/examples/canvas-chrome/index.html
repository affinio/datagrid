<!doctype html>
<html lang="en">
  <head>
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { background: #f4f6f8; }
      #page-loading { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 12px; background: #f4f6f8; color: #52647a; font: 500 14px/1.4 system-ui, sans-serif; }
      #page-loading__spinner { width: 20px; height: 20px; border: 2px solid #cbd3de; border-top-color: #245ea8; border-radius: 50%; animation: page-loading-spin 0.8s linear infinite; }
      #page-loading[data-state="error"] #page-loading__spinner { display: none; }
      @keyframes page-loading-spin { to { transform: rotate(360deg); } }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas chrome · Affino DataGrid DOM sandbox</title>
  </head>
  <body>
    <div id="page-loading" role="status" aria-live="polite"><span id="page-loading__spinner" aria-hidden="true"></span><span>Loading DataGrid…</span></div>
    <main class="page-shell" data-demo-content inert aria-hidden="true" aria-busy="true">
      <header class="page-header">
        <div class="page-header__eyebrow">
          <p class="eyebrow">Example 42 · Canvas chrome</p>
          <label class="example-picker">Example
            <select data-example-picker aria-label="Choose a sandbox example">
              <option value="/">Overview</option>
              <option value="/examples/pinned-bottom/">41 · Pinned bottom rows</option>
              <option value="/examples/canvas-chrome/" selected>42 · Canvas chrome</option>
            </select>
          </label>
        </div>
        <h1>Canvas grid chrome</h1>
        <p class="intro">The grid lines use Canvas; cells remain DOM elements with their normal content and accessibility semantics.</p>
      </header>
      <section id="canvas-chrome-demo" class="demo-panel" aria-label="Canvas chrome example"></section>
      <nav class="example-links" aria-label="Sandbox examples">
        <a href="/examples/pinned-bottom/">← Previous: pinned bottom rows</a>
        <a href="/">All examples</a>
      </nav>
      <footer>Grid chrome: Canvas · Cells and interaction: DOM adapter · Framework: none</footer>
    </main>
    <script type="module" src="/src/examplePicker.ts"></script>
    <script type="module" src="/src/examples/canvas-chrome/main.ts"></script>
  </body>
</html>
