<!doctype html>
<html lang="en">
  <head>
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { background: #f4f6f8; }
      #page-loading { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 12px; background: #f4f6f8; color: #52647a; font: 500 14px/1.4 system-ui, sans-serif; }
      #page-loading__spinner { width: 20px; height: 20px; border: 2px solid #cbd3de; border-top-color: #245ea8; border-radius: 50%; animation: page-loading-spin 0.8s linear infinite; }
      #page-loading[data-state="error"] #page-loading__spinner { display: none; }
      @keyframes page-loading-spin { to { transform: rotate(360deg); } }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Filtering · Affino DataGrid DOM sandbox</title>
  </head>
  <body>
    <div id="page-loading" role="status" aria-live="polite">
      <span id="page-loading__spinner" aria-hidden="true"></span>
      <span>Loading DataGrid…</span>
    </div>
    <main class="page-shell" data-demo-content inert aria-hidden="true" aria-busy="true">
      <header class="page-header">
        <div class="page-header__eyebrow">
          <p class="eyebrow">Example 07 · Core filtering</p>
          <label class="example-picker">Example
            <select data-example-picker aria-label="Choose a sandbox example">
              <option value="/">Overview</option>
              <option value="/examples/sorting/">02 · Sorting</option>
              <option value="/examples/updates/">03 · Row updates</option>
              <option value="/examples/selection/">04 · Cell selection</option>
              <option value="/examples/range-selection/">05 · Range selection</option>
              <option value="/examples/keyboard-navigation/">06 · Keyboard navigation</option>
              <option value="/examples/filtering/" selected>07 · Filtering</option>
              <option value="/examples/pagination/">08 · Pagination</option>
              <option value="/examples/virtualization/">09 · Row virtualization</option>
              <option value="/examples/column-virtualization/">10 · Column virtualization</option>
              <option value="/examples/column-resizing/">11 · Column resizing</option>
              <option value="/examples/column-reordering/">12 · Column reordering</option>
              <option value="/examples/column-layout/">13 · Column layout</option>
              <option value="/examples/editing/">14 · Cell editing</option>
              <option value="/examples/clipboard/">15 · Clipboard</option>
              <option value="/examples/stress/">16 · Stress test</option>


              <option value="/examples/grouping/">17 · Grouping</option>
              <option value="/examples/tree-data/">18 · Tree data</option>
            </select>
          </label>
        </div>
        <h1>Filter rows</h1>
        <p class="intro">Choose a team to filter the logical row projection. Clear the filter to restore every record.</p>
      </header>

      <section id="filtering-demo" class="demo-panel" aria-label="Row filtering example"></section>
      <nav class="example-links" aria-label="Sandbox examples">
        <a href="/examples/keyboard-navigation/">← Previous: keyboard navigation</a>
        <a href="/examples/pagination/">Next: pagination →</a>
      </nav>
      <footer>Filter state and projection: Core · Controls and rendering: DOM adapter · Framework: none</footer>
    </main>
    <script type="module" src="/src/examplePicker.ts"></script>
    <script type="module" src="/src/examples/filtering/main.ts"></script>
  </body>
</html>
