name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    name: datagrid-quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run quality:lock:datagrid:parity
      - name: Upload quality gate artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: datagrid-quality-gates-artifacts
          path: |
            artifacts/quality
            artifacts/performance

  benchmark-gates:
    name: datagrid-benchmark-gates
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run bench:regression
      - name: Print datasource churn benchmark log
        if: always()
        run: |
          if [ -f artifacts/performance/bench-datagrid-datasource-churn.log ]; then
            cat artifacts/performance/bench-datagrid-datasource-churn.log
          else
            echo "Datasource churn log was not produced."
          fi
      - name: Upload benchmark gate artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: datagrid-benchmark-gates-artifacts
          path: |
            artifacts/quality
            artifacts/performance
